name: NumPy compatibility
on:
  pull_request:
    paths: ['setup.py', 'ding/torch_utils/**', 'ding/envs/**', '.github/workflows/numpy-compatibility.yml']
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            numpy: 'numpy==1.26.4'
          - python: '3.12'
            numpy: 'numpy>=2,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . '${{ matrix.numpy }}' pytest 'opencv-python-headless>=4.10'
      - run: python -m pip check
      - run: python -m pytest -q ding/torch_utils/tests/test_numpy_compatibility.py
